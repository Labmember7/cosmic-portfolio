<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1329" />
      <stop offset="70%" stop-color="#050814" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>

    <!-- Pulsar Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Orbital Trajectory Spline Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Futuristic Border Accent -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Deep Cosmos Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#spaceBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Planetary Orbital Ring (Tilted Cosmic Spline) -->
  <ellipse cx="32" cy="32" rx="22" ry="10.5" transform="rotate(-28 32 32)" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="112 16" opacity="0.95" />

  <!-- Orbiting Telemetry Photon Beacon -->
  <circle cx="49" cy="22.5" r="2.8" fill="#fbbf24" />
  <circle cx="49" cy="22.5" r="4.2" fill="#f59e0b" opacity="0.3" />

  <!-- Cardinal Avionics Reticle Ticks -->
  <line x1="32" y1="7" x2="32" y2="13" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="32" y1="51" x2="32" y2="57" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="7" y1="32" x2="13" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="51" y1="32" x2="57" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Outer Radiant Energy Aura -->
  <circle cx="32" cy="32" r="13" fill="url(#coreGlow)" opacity="0.85" />

  <!-- Brilliant White Singularity Nucleus -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" />
  <circle cx="32" cy="32" r="2.2" fill="#e0f2fe" />
</svg>

